name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: plantgpt
          POSTGRES_USER: plantgpt
          POSTGRES_PASSWORD: plantgpt
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plantgpt"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://plantgpt:plantgpt@localhost:5432/plantgpt
      DJANGO_SECRET_KEY: ci-insecure-key
      DJANGO_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
