[project]
name = "plantgpt"
version = "0.0.0"
description = "Conversational plant-operations brain over a constraint-based production scheduler (synthetic data; not a shop-floor control system)."
requires-python = ">=3.11"
dependencies = [
    "django>=5.1,<5.3",
    "psycopg[binary]>=3.2",
    "dj-database-url>=2.3",
    "gunicorn>=23.0",
    "whitenoise>=6.8",
    "python-dotenv>=1.0",
    "ortools>=9.11",
    "pandas>=2.2",
    "plotly>=5.24",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
testpaths = ["tests"]

# Setuptools: this is an application, not a distributable library. Don't auto-discover
# packages (the Django apps are run in place, never pip-installed).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []
